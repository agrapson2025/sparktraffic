<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparkTraffic Studio & Campaign Engine</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel to interpret JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('campaigns');
      const [targetDomain, setTargetDomain] = useState('https://mywebsite.com');
      const [measurementId, setMeasurementId] = useState('G-DEMO123456');
      const [isCrawling, setIsCrawling] = useState(false);
      const [dailyVisits, setDailyVisits] = useState(2500);
      const [bounceRate, setBounceRate] = useState(35);
      const [trafficSource, setTrafficSource] = useState('organic');
      const [clickThroughRate, setClickThroughRate] = useState(15);

      const [discoveredUrls, setDiscoveredUrls] = useState([
        { id: 1, path: '/', enabled: true, weight: 40 },
        { id: 2, path: '/pricing', enabled: true, weight: 25 },
        { id: 3, path: '/features', enabled: true, weight: 20 },
        { id: 4, path: '/blog/how-it-works', enabled: true, weight: 15 }
      ]);

      const [newPath, setNewPath] = useState('');

      const [campaigns, setCampaigns] = useState([
        {
          id: 'CMP-9041',
          domain: 'https://mywebsite.com',
          dailyVisits: 2500,
          deliveredToday: 1842,
          activeUrls: 4,
          status: 'active',
          source: 'organic',
          bounceRate: 35
        }
      ]);

      const [hitLogs, setHitLogs] = useState([]);

      const crawlDomain = () => {
        setIsCrawling(true);
        setTimeout(() => {
          setDiscoveredUrls([
            { id: 1, path: '/', enabled: true, weight: 35 },
            { id: 2, path: '/about', enabled: true, weight: 15 },
            { id: 3, path: '/pricing', enabled: true, weight: 25 },
            { id: 4, path: '/blog/post-1', enabled: true, weight: 15 },
            { id: 5, path: '/contact', enabled: true, weight: 10 }
          ]);
          setIsCrawling(false);
        }, 1200);
      };

      const equalizeWeights = () => {
        const active = discoveredUrls.filter(u => u.enabled);
        if (active.length === 0) return;
        const split = Math.floor(100 / active.length);
        const remainder = 100 - (split * active.length);
        let assigned = 0;
        setDiscoveredUrls(discoveredUrls.map((u) => {
          if (!u.enabled) return { ...u, weight: 0 };
          assigned++;
          return { ...u, weight: split + (assigned === 1 ? remainder : 0) };
        }));
      };

      const addPath = () => {
        if (!newPath) return;
        const cleanPath = newPath.startsWith('/') ? newPath : '/' + newPath;
        setDiscoveredUrls([...discoveredUrls, { id: Date.now(), path: cleanPath, enabled: true, weight: 10 }]);
        setNewPath('');
      };

      const removePath = (id) => {
        setDiscoveredUrls(discoveredUrls.filter(u => u.id !== id));
      };

      const toggleUrl = (id) => {
        setDiscoveredUrls(discoveredUrls.map(u => u.id === id ? { ...u, enabled: !u.enabled } : u));
      };

      const createCampaign = () => {
        const activeCount = discoveredUrls.filter(u => u.enabled).length;
        const newCamp = {
          id: `CMP-${Math.floor(1000 + Math.random() * 9000)}`,
          domain: targetDomain,
          dailyVisits: dailyVisits,
          deliveredToday: 0,
          activeUrls: activeCount,
          status: 'active',
          source: trafficSource,
          bounceRate: bounceRate
        };
        setCampaigns([newCamp, ...campaigns]);
        setActiveTab('campaigns');
      };

      const toggleCampaignStatus = (id) => {
        setCampaigns(campaigns.map(c => {
          if (c.id === id) {
            return { ...c, status: c.status === 'active' ? 'paused' : 'active' };
          }
          return c;
        }));
      };

      useEffect(() => {
        const interval = setInterval(() => {
          const activeCamps = campaigns.filter(c => c.status === 'active');
          if (activeCamps.length === 0) return;

          const camp = activeCamps[Math.floor(Math.random() * activeCamps.length)];
          const enabledUrls = discoveredUrls.filter(u => u.enabled);
          const chosenUrl = enabledUrls.length > 0 ? enabledUrls[Math.floor(Math.random() * enabledUrls.length)].path : '/';

          const countries = ['United States', 'United Kingdom', 'Germany', 'Canada', 'France', 'Japan'];
          const isClicked = Math.random() * 100 < clickThroughRate;

          const newLog = {
            id: Math.random().toString(36).substring(7),
            time: new Date().toLocaleTimeString(),
            domain: camp.domain,
            url: chosenUrl,
            country: countries[Math.floor(Math.random() * countries.length)],
            source: camp.source,
            clicked: isClicked,
            status: '200 OK - Dispatched to GA4'
          };

          setHitLogs(prev => [newLog, ...prev.slice(0, 49)]);

          setCampaigns(prev => prev.map(c => {
            if (c.id === camp.id) {
              return { ...c, deliveredToday: c.deliveredToday + 1 };
            }
            return c;
          }));
        }, 2800);

        return () => clearInterval(interval);
      }, [campaigns, discoveredUrls, clickThroughRate]);

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4">
            <div>
              <div className="flex items-center gap-3 px-2 py-4 border-b border-slate-800 mb-6">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
                  ST
                </div>
                <div>
                  <h1 className="font-bold text-base leading-tight tracking-wide">SparkTraffic</h1>
                  <p className="text-xs text-indigo-400">Automated Delivery Engine</p>
                </div>
              </div>

              <nav className="space-y-1">
                <button 
                  onClick={() => setActiveTab('campaigns')}
                  className={`w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition ${activeTab === 'campaigns' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                >
                  ⚡ Active Campaigns
                </button>
                <button 
                  onClick={() => setActiveTab('new')}
                  className={`w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition ${activeTab === 'new' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                >
                  + Launch Campaign & Crawler
                </button>
                <button 
                  onClick={() => setActiveTab('live')}
                  className={`w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition ${activeTab === 'live' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                >
                  📡 Real-time GA4 Stream
                </button>
              </nav>
            </div>

            <div className="p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-xs text-slate-400">
              <div className="flex items-center gap-2 mb-1 text-slate-200 font-semibold">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Proxy Cluster Active
              </div>
              <p>Global Residential Proxies: 12,480 Online</p>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 overflow-y-auto p-8 bg-slate-950">
            {activeTab === 'campaigns' && (
              <div className="max-w-6xl mx-auto space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold">Campaign Dashboard</h2>
                    <p className="text-slate-400 text-sm">Monitor simulated visitor distributions and active GA4 runs.</p>
                  </div>
                  <button 
                    onClick={() => setActiveTab('new')}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium shadow-lg shadow-indigo-600/20 transition"
                  >
                    + New Multi-URL Campaign
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                    <p className="text-slate-400 text-xs font-semibold uppercase">Total Visits Today</p>
                    <h3 className="text-3xl font-extrabold mt-1 text-indigo-400">
                      {campaigns.reduce((acc, c) => acc + c.deliveredToday, 0).toLocaleString()}
                    </h3>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                    <p className="text-slate-400 text-xs font-semibold uppercase">Active Campaigns</p>
                    <h3 className="text-3xl font-extrabold mt-1 text-white">
                      {campaigns.filter(c => c.status === 'active').length}
                    </h3>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                    <p className="text-slate-400 text-xs font-semibold uppercase">Simulated GA4 Status</p>
                    <h3 className="text-3xl font-extrabold mt-1 text-emerald-400">Connected</h3>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                  <div className="px-6 py-4 border-b border-slate-800 font-semibold text-sm">
                    Managed Target Domains
                  </div>
                  <table className="w-full text-left text-sm text-slate-300">
                    <thead className="bg-slate-950/60 text-xs uppercase text-slate-400">
                      <tr>
                        <th className="px-6 py-3">Domain</th>
                        <th className="px-6 py-3">Source</th>
                        <th className="px-6 py-3">Pages Spread</th>
                        <th className="px-6 py-3">Delivered / Goal</th>
                        <th className="px-6 py-3">Status</th>
                        <th className="px-6 py-3">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {campaigns.map(camp => (
                        <tr key={camp.id} className="hover:bg-slate-800/40">
                          <td className="px-6 py-4 font-medium text-white">{camp.domain}</td>
                          <td className="px-6 py-4 capitalize">{camp.source}</td>
                          <td className="px-6 py-4">{camp.activeUrls} active pages</td>
                          <td className="px-6 py-4">{camp.deliveredToday} / {camp.dailyVisits}</td>
                          <td className="px-6 py-4">
                            <span className={`px-2 py-1 rounded text-xs font-medium ${camp.status === 'active' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>
                              {camp.status}
                            </span>
                          </td>
                          <td className="px-6 py-4">
                            <button 
                              onClick={() => toggleCampaignStatus(camp.id)}
                              className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded border border-slate-700 transition"
                            >
                              {camp.status === 'active' ? 'Pause' : 'Resume'}
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'new' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl font-bold">New Campaign & Link Crawler</h2>
                  <p className="text-slate-400 text-sm">Fetch all URLs from any domain and distribute visitors uniformly into Google Analytics.</p>
                </div>

                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-5">
                  <label className="block text-sm font-semibold text-slate-300">Target Website Domain</label>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      value={targetDomain}
                      onChange={(e) => setTargetDomain(e.target.value)}
                      placeholder="https://example.com"
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white"
                    />
                    <button 
                      onClick={crawlDomain}
                      disabled={isCrawling}
                      className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition"
                    >
                      {isCrawling ? 'Crawling...' : 'Fetch Links'}
                    </button>
                  </div>

                  <div className="border border-slate-800 rounded-lg p-4 bg-slate-950/50 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-semibold text-slate-300">Target URL Distribution & Weight (%)</span>
                      <button 
                        onClick={equalizeWeights} 
                        className="text-xs text-indigo-400 bg-indigo-950/40 px-2.5 py-1 rounded border border-indigo-800/40"
                      >
                        ⚖️ Equalize Spread
                      </button>
                    </div>

                    {discoveredUrls.map(item => (
                      <div key={item.id} className="flex items-center gap-3 bg-slate-900 p-2.5 rounded-lg border border-slate-800 text-sm">
                        <input 
                          type="checkbox" 
                          checked={item.enabled}
                          onChange={() => toggleUrl(item.id)}
                          className="rounded bg-slate-800 border-slate-700 text-indigo-600 w-4 h-4"
                        />
                        <span className="flex-1 font-mono text-xs text-slate-300 truncate">{targetDomain}{item.path}</span>
                        <div className="flex items-center gap-1">
                          <input 
                            type="number"
                            value={item.weight}
                            onChange={(e) => {
                              const val = parseInt(e.target.value) || 0;
                              setDiscoveredUrls(discoveredUrls.map(u => u.id === item.id ? { ...u, weight: val } : u));
                            }}
                            className="w-16 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-right text-white"
                          />
                          <span className="text-xs text-slate-500">%</span>
                        </div>
                        <button onClick={() => removePath(item.id)} className="text-slate-500 hover:text-red-400 text-xs px-2">
                          ✕
                        </button>
                      </div>
                    ))}

                    <div className="flex gap-2 mt-2">
                      <input 
                        type="text" 
                        value={newPath}
                        onChange={(e) => setNewPath(e.target.value)}
                        placeholder="Add custom route (e.g., /pricing)" 
                        className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-300"
                      />
                      <button onClick={addPath} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded border border-slate-700">
                        Add Path
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs font-semibold text-slate-400">Measurement ID</label>
                      <input 
                        type="text" 
                        value={measurementId}
                        onChange={(e) => setMeasurementId(e.target.value)}
                        className="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-400">Traffic Source Channel</label>
                      <select 
                        value={trafficSource}
                        onChange={(e) => setTrafficSource(e.target.value)}
                        className="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300"
                      >
                        <option value="organic">Organic Search (Google / Bing)</option>
                        <option value="social">Social (Reddit, X)</option>
                        <option value="referral">Referral</option>
                        <option value="direct">Direct</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="text-xs font-semibold text-slate-400">Daily Visits Goal</label>
                      <input 
                        type="number" 
                        value={dailyVisits}
                        onChange={(e) => setDailyVisits(parseInt(e.target.value) || 0)}
                        className="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-400">Bounce Rate ({bounceRate}%)</label>
                      <input 
                        type="range" 
                        min="10" 
                        max="90" 
                        value={bounceRate}
                        onChange={(e) => setBounceRate(parseInt(e.target.value))}
                        className="w-full mt-3 accent-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-400">Click Rate ({clickThroughRate}%)</label>
                      <input 
                        type="range" 
                        min="0" 
                        max="50" 
                        value={clickThroughRate}
                        onChange={(e) => setClickThroughRate(parseInt(e.target.value))}
                        className="w-full mt-3 accent-indigo-500"
                      />
                    </div>
                  </div>

                  <button 
                    onClick={createCampaign}
                    className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold text-white rounded-lg transition shadow-lg shadow-indigo-600/20"
                  >
                    Launch & Distribute Simulation
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'live' && (
              <div className="max-w-6xl mx-auto space-y-4">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold">Real-time GA4 Stream</h2>
                    <p className="text-slate-400 text-sm">Hits generated with session & click tracking parameters.</p>
                  </div>
                  <div className="text-xs text-emerald-400 bg-emerald-950/40 px-3 py-1.5 rounded-full border border-emerald-800/40">
                    🟢 Stream Active
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                  <table className="w-full text-left text-xs font-mono text-slate-300">
                    <thead className="bg-slate-950 text-slate-400 uppercase">
                      <tr>
                        <th className="px-4 py-3">Time</th>
                        <th className="px-4 py-3">URL</th>
                        <th className="px-4 py-3">Country</th>
                        <th className="px-4 py-3">Channel</th>
                        <th className="px-4 py-3">Click</th>
                        <th className="px-4 py-3">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {hitLogs.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="text-center py-8 text-slate-500">
                            Awaiting initial cycle...
                          </td>
                        </tr>
                      ) : (
                        hitLogs.map((log) => (
                          <tr key={log.id} className="hover:bg-slate-800/50">
                            <td className="px-4 py-3 text-slate-400">{log.time}</td>
                            <td className="px-4 py-3 text-indigo-300">{log.domain}{log.url}</td>
                            <td className="px-4 py-3">{log.country}</td>
                            <td className="px-4 py-3 capitalize">{log.source}</td>
                            <td className="px-4 py-3">
                              {log.clicked ? <span className="text-emerald-400 font-bold">Click</span> : <span className="text-slate-500">Pageview</span>}
                            </td>
                            <td className="px-4 py-3 text-emerald-400">{log.status}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
