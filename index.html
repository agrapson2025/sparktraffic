<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparkTraffic GA4+ | Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #060b18; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #060b18; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('crawl_launch');
      const [targetDomain, setTargetDomain] = useState('https://example.com');
      const [measurementId, setMeasurementId] = useState('');
      const [apiSecret, setApiSecret] = useState('');
      const [trafficSource, setTrafficSource] = useState('google');
      const [trafficMedium, setTrafficMedium] = useState('organic');
      const [campaignName, setCampaignName] = useState('sparktraffic_boost');
      const [isCrawling, setIsCrawling] = useState(false);
      const [crawlStatus, setCrawlStatus] = useState('');
      const [fireClick, setFireClick] = useState(true);

      const [discoveredUrls, setDiscoveredUrls] = useState([
        { id: 1, path: '/', weight: 50, enabled: true },
        { id: 2, path: '/pricing', weight: 30, enabled: true },
        { id: 3, path: '/features', weight: 20, enabled: true }
      ]);
      const [newPathInput, setNewPathInput] = useState('');

      const [isSending, setIsSending] = useState(false);
      const [sendResult, setSendResult] = useState(null);
      const [liveLogs, setLiveLogs] = useState([]);

      // 1. Real Crawler action (No 400 errors)
      const crawlRealDomain = async () => {
        if (!targetDomain || !targetDomain.trim()) {
          setCrawlStatus('Please enter a valid domain first.');
          return;
        }
        setIsCrawling(true);
        setCrawlStatus('Crawling website pages and extracting internal URLs...');
        setSendResult(null);

        try {
          const res = await fetch(`/api/crawl?domain=${encodeURIComponent(targetDomain.trim())}`);
          const data = await res.json();
          if (data && data.urls && data.urls.length > 0) {
            setDiscoveredUrls(data.urls);
            setCrawlStatus(`Discovered & balanced ${data.urls.length} URLs from ${data.domain}`);
          } else {
            setCrawlStatus('Could not extract sub-paths. Fallback root URL loaded.');
          }
        } catch (err) {
          setCrawlStatus(`Crawler error: ${err.message}`);
        } finally {
          setIsCrawling(false);
        }
      };

      const equalizeSpread = () => {
        const active = discoveredUrls.filter(u => u.enabled);
        if (active.length === 0) return;
        const split = Math.floor(100 / active.length);
        const remainder = 100 - (split * active.length);
        let count = 0;
        setDiscoveredUrls(discoveredUrls.map(u => {
          if (!u.enabled) return { ...u, weight: 0 };
          count++;
          return { ...u, weight: split + (count === 1 ? remainder : 0) };
        }));
      };

      const toggleUrlCheck = (id) => {
        setDiscoveredUrls(discoveredUrls.map(u => u.id === id ? { ...u, enabled: !u.enabled } : u));
      };

      const updateWeight = (id, val) => {
        setDiscoveredUrls(discoveredUrls.map(u => u.id === id ? { ...u, weight: Number(val) || 0 } : u));
      };

      const deleteUrl = (id) => {
        setDiscoveredUrls(discoveredUrls.filter(u => u.id !== id));
      };

      const addCustomUrl = () => {
        if (!newPathInput.trim()) return;
        const formatted = newPathInput.trim().startsWith('/') ? newPathInput.trim() : '/' + newPathInput.trim();
        setDiscoveredUrls([...discoveredUrls, { id: Date.now(), path: formatted, weight: 10, enabled: true }]);
        setNewPathInput('');
      };

      // 2. Explicit GA4 Dispatch Action (No unauthenticated background loops)
      const dispatchGa4Hit = async () => {
        if (!measurementId.trim().startsWith('G-')) {
          setSendResult({ error: 'Please enter a valid GA4 Measurement ID (starting with G-).' });
          return;
        }
        if (!apiSecret.trim()) {
          setSendResult({ error: 'Please enter your GA4 API Secret generated in GA4 Admin.' });
          return;
        }

        const activeUrls = discoveredUrls.filter(u => u.enabled);
        const selectedUrl = activeUrls.length > 0
          ? activeUrls[Math.floor(Math.random() * activeUrls.length)].path
          : '/';

        setIsSending(true);
        setSendResult(null);

        try {
          const res = await fetch('/api/dispatch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              measurement_id: measurementId.trim(),
              api_secret: apiSecret.trim(),
              domain: targetDomain,
              path: selectedUrl,
              utm_source: trafficSource,
              utm_medium: trafficMedium,
              utm_campaign: campaignName,
              fire_click: fireClick
            })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            setSendResult({ success: true, message: data.ga_status });
            setLiveLogs(prev => [data, ...prev.slice(0, 30)]);
          } else {
            setSendResult({ error: data.error || 'Google Analytics rejected the transmission.' });
          }
        } catch (err) {
          setSendResult({ error: `Network error: ${err.message}` });
        } finally {
          setIsSending(false);
        }
      };

      const totalWeight = discoveredUrls.reduce((sum, u) => u.enabled ? sum + (Number(u.weight) || 0) : sum, 0);

      return (
        <div className="flex h-screen bg-[#060b18] text-slate-100 overflow-hidden font-sans">
          
          {/* SIDEBAR */}
          <aside className="w-64 bg-[#0a1124] border-r border-slate-800/80 flex flex-col justify-between p-4 flex-shrink-0">
            <div>
              <div className="flex items-center gap-3 px-2 py-3 mb-5 border-b border-slate-800">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
                  ⚡
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-extrabold text-base tracking-tight text-white">SparkTraffic</span>
                    <span className="text-[10px] bg-indigo-500/30 text-indigo-300 font-semibold px-1.5 py-0.5 rounded border border-indigo-500/30">GA4+</span>
                  </div>
                </div>
              </div>

              <div className="bg-[#0f1935] border border-slate-800/80 rounded-xl p-3.5 mb-6">
                <div className="flex justify-between items-center text-xs text-amber-400 font-semibold mb-1">
                  <span>⚡ Account Credits</span>
                  <span className="text-slate-400">Unlimited</span>
                </div>
                <div className="text-2xl font-black text-white tracking-tight">
                  100,000 <span className="text-xs text-slate-400 font-normal">pts</span>
                </div>
              </div>

              <nav className="space-y-1 text-sm font-medium">
                <button 
                  onClick={() => setActiveTab('crawl_launch')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition ${activeTab === 'crawl_launch' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}`}
                >
                  <span className="text-base">⊕</span> Crawl & Dispatcher
                </button>
                <button 
                  onClick={() => setActiveTab('logs')}
                  className={`w-full flex justify-between items-center px-3 py-2.5 rounded-lg transition ${activeTab === 'logs' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}`}
                >
                  <div className="flex items-center gap-3">
                    <span className="text-base">∿</span> Event Logs
                  </div>
                  <span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">{liveLogs.length}</span>
                </button>
              </nav>
            </div>

            <div className="p-3 bg-[#0a1124] rounded-xl border border-slate-800 text-xs text-slate-400">
              <span className="text-emerald-400 font-semibold block mb-0.5">● Ready for Dispatch</span>
              Google Measurement Protocol V4
            </div>
          </aside>

          {/* MAIN WORKSPACE */}
          <main className="flex-1 overflow-y-auto p-8 bg-[#060b18]">
            
            {activeTab === 'crawl_launch' && (
              <div className="max-w-4xl mx-auto space-y-6">
                
                <div className="border-b border-slate-800/80 pb-4">
                  <h1 className="text-2xl font-black text-white">Domain Crawler & GA4 Measurement Dispatcher</h1>
                  <p className="text-xs text-slate-400 mt-1">Crawl domain links and dispatch verified server-side hits straight into GA4 Realtime reports.</p>
                </div>

                {/* 1. DOMAIN SCRAPER */}
                <div className="bg-[#0b1329] border border-slate-800 rounded-2xl p-6 space-y-5 shadow-xl">
                  <div>
                    <label className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 block">
                      Target Domain to Crawl
                    </label>
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        value={targetDomain}
                        onChange={(e) => setTargetDomain(e.target.value)}
                        placeholder="https://example.com"
                        className="flex-1 bg-[#060b18] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white font-mono focus:outline-none focus:border-indigo-500"
                      />
                      <button 
                        onClick={crawlRealDomain}
                        disabled={isCrawling}
                        className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-600/20 transition disabled:opacity-50"
                      >
                        {isCrawling ? 'Crawling...' : 'Auto-Crawl / Fetch Links'}
                      </button>
                    </div>
                    {crawlStatus && (
                      <p className="text-xs text-indigo-400 mt-2 font-mono">{crawlStatus}</p>
                    )}
                  </div>

                  {/* Discovered URLs Box */}
                  <div className="border border-slate-800/80 rounded-xl p-4 bg-[#070d1e]">
                    <div className="flex justify-between items-center mb-3">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-bold text-white uppercase">
                          Discovered URLs ({discoveredUrls.filter(u => u.enabled).length} active)
                        </span>
                        <span className="text-xs px-2 py-0.5 rounded font-mono font-bold bg-slate-800 text-indigo-300">
                          Weight: {totalWeight}%
                        </span>
                      </div>
                      <button 
                        onClick={equalizeSpread}
                        className="text-xs text-indigo-400 bg-indigo-950/60 px-3 py-1 rounded-lg border border-indigo-800/50"
                      >
                        Equalize Weights
                      </button>
                    </div>

                    <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                      {discoveredUrls.map((item) => (
                        <div key={item.id} className="flex items-center gap-3 bg-[#0a1124] p-2.5 rounded-xl border border-slate-800 text-xs font-mono">
                          <input 
                            type="checkbox" 
                            checked={item.enabled}
                            onChange={() => toggleUrlCheck(item.id)}
                            className="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600"
                          />
                          <span className="flex-1 text-slate-300 truncate">{targetDomain}{item.path}</span>
                          <input 
                            type="range"
                            min="0"
                            max="100"
                            value={item.weight}
                            onChange={(e) => updateWeight(item.id, e.target.value)}
                            className="w-24 accent-indigo-500 cursor-pointer"
                          />
                          <span className="w-10 text-right text-indigo-400 font-bold">{item.weight}%</span>
                          <button onClick={() => deleteUrl(item.id)} className="text-slate-500 hover:text-red-400 px-1">✕</button>
                        </div>
                      ))}
                    </div>

                    <div className="flex gap-2 mt-3 pt-3 border-t border-slate-800">
                      <input 
                        type="text" 
                        value={newPathInput}
                        onChange={(e) => setNewPathInput(e.target.value)}
                        placeholder="Add manual path (e.g. /blog/post-1)"
                        className="flex-1 bg-[#060b18] border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300 font-mono"
                      />
                      <button onClick={addCustomUrl} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs">
                        + Add Route
                      </button>
                    </div>
                  </div>

                  {/* 2. GA4 DISPATCHER CREDENTIALS & SENDER */}
                  <div className="border border-slate-800/80 rounded-xl p-5 bg-[#070d1e] space-y-4">
                    <h3 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span>📊</span> Google Analytics 4 Transmission Settings
                    </h3>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs font-semibold text-slate-400 mb-1 block">
                          GA4 Measurement ID <span className="text-rose-400">*</span>
                        </label>
                        <input 
                          type="text" 
                          placeholder="G-XXXXXXXXXX"
                          value={measurementId}
                          onChange={(e) => setMeasurementId(e.target.value)}
                          className="w-full bg-[#060b18] border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-400 mb-1 block">
                          Measurement Protocol API Secret <span className="text-rose-400">*</span>
                        </label>
                        <input 
                          type="password" 
                          placeholder="Created in GA4 Admin"
                          value={apiSecret}
                          onChange={(e) => setApiSecret(e.target.value)}
                          className="w-full bg-[#060b18] border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs font-semibold text-slate-400 mb-1 block">Source / Channel Preset</label>
                        <select 
                          value={`${trafficSource}:${trafficMedium}`}
                          onChange={(e) => {
                            const [src, med] = e.target.value.split(':');
                            setTrafficSource(src);
                            setTrafficMedium(med);
                          }}
                          className="w-full bg-[#060b18] border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                        >
                          <option value="google:organic">Google / Organic</option>
                          <option value="bing:organic">Bing / Organic</option>
                          <option value="reddit:social">Reddit / Social</option>
                          <option value="direct:(none)">Direct / None</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-400 mb-1 block">Campaign Name (utm_campaign)</label>
                        <input 
                          type="text" 
                          value={campaignName}
                          onChange={(e) => setCampaignName(e.target.value)}
                          className="w-full bg-[#060b18] border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono"
                        />
                      </div>
                    </div>

                    <div className="flex items-center gap-2 pt-1">
                      <input 
                        type="checkbox"
                        id="fireClick"
                        checked={fireClick}
                        onChange={(e) => setFireClick(e.target.checked)}
                        className="rounded bg-slate-900 border-slate-700 text-indigo-600"
                      />
                      <label htmlFor="fireClick" className="text-xs text-slate-300">
                        Include In-Page Interaction / Click Event with Hit
                      </label>
                    </div>

                    {sendResult && (
                      <div className={`p-3 rounded-lg text-xs font-mono ${sendResult.success ? 'bg-emerald-950/60 text-emerald-300 border border-emerald-800' : 'bg-rose-950/60 text-rose-300 border border-rose-800'}`}>
                        {sendResult.success ? `✓ ${sendResult.message}` : `⚠ ${sendResult.error}`}
                      </div>
                    )}

                    <button 
                      onClick={dispatchGa4Hit}
                      disabled={isSending}
                      className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 font-bold text-white rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm disabled:opacity-50"
                    >
                      {isSending ? 'Sending to Google Analytics...' : '🚀 Dispatch Test Hit to Google Analytics'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: LOGS */}
            {activeTab === 'logs' && (
              <div className="max-w-5xl mx-auto space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-black text-white">Dispatched GA4 Telemetry History</h2>
                  <button onClick={() => setActiveTab('crawl_launch')} className="px-3 py-1.5 bg-indigo-600 text-xs font-bold rounded-lg">
                    Back to Dispatcher
                  </button>
                </div>

                <div className="bg-[#0b1329] border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <table className="w-full text-left text-xs font-mono">
                    <thead className="bg-[#070d1e] text-slate-400 uppercase">
                      <tr>
                        <th className="px-4 py-3">Time</th>
                        <th className="px-4 py-3">Dispatched Target</th>
                        <th className="px-4 py-3">Source/Medium</th>
                        <th className="px-4 py-3">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 text-slate-300">
                      {liveLogs.length === 0 ? (
                        <tr>
                          <td colSpan="4" className="text-center py-8 text-slate-500 font-sans">
                            No hits sent yet. Use the dispatcher to trigger hits.
                          </td>
                        </tr>
                      ) : (
                        liveLogs.map((log, i) => (
                          <tr key={i} className="hover:bg-slate-800/40">
                            <td className="px-4 py-3 text-slate-400">{log.timestamp}</td>
                            <td className="px-4 py-3 text-indigo-300 truncate max-w-xs">{log.target_url}</td>
                            <td className="px-4 py-3">{log.channel}</td>
                            <td className="px-4 py-3 text-emerald-400">{log.ga_status}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
